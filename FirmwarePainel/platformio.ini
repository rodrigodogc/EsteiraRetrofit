; PlatformIO Project Configuration — Painel Superior (Esteira Retrofit)
; Alvo: ESP32 WROOM DevKit — comunica com a placa de potência (EsteiraC3,
; ESP32-C3) via ESP-NOW. Sem WiFi/AP próprio — só o rádio em modo STA para o
; ESP-NOW funcionar (ver EspNowClient::begin()).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson             @ ^7.4.2
    maxint-rd/TM16xx LEDs and Buttons

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; TM16xx LEDs and Buttons compila TM16xxMatrixGFX.cpp (suporte a matriz de
    ; LED via Adafruit GFX) mesmo sem usarmos essa classe — só usamos TM1640
    ; via TreadmillDisplay. O aviso é só #warning (não quebra o build); -Wno-cpp
    ; suprime especificamente essa classe de aviso do preprocessador, sem
    ; silenciar warnings reais nem adicionar a dependência Adafruit GFX à toa.
    -Wno-cpp
