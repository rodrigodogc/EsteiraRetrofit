; PlatformIO Project Configuration — Esteira Ergométrica Retrofit
; Alvo: ESP32-C3 "Super Mini" — chip RISC-V single-core, sem UART-USB dedicado
; (Serial usa o USB-CDC nativo do chip; por isso os build_flags USB abaixo).
[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

board_build.filesystem = littlefs

lib_ignore = ESPAsyncTCP, RPAsyncTCP
lib_deps =
    esp32async/AsyncTCP          @ ^3.4.10
    esp32async/ESPAsyncWebServer @ ^3.9.4
    bblanchon/ArduinoJson        @ ^7.4.2
    br3ttb/PID                   @ ^1.2.1

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
